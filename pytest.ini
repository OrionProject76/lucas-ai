# pytest.ini — configuration des tests
#
# Le marqueur « integration » distingue les tests qui parlent aux vrais
# services (Ollama, Piper, registre Windows) de ceux qui mockent tout.
# Les premiers sont lents et dépendants de l'environnement : ils sont
# donc exclus par défaut, et lancés explicitement via just test-integration.

[pytest]
markers =
    integration: parle aux vrais services — lent, exclu de la suite par défaut

# -m "not integration" par défaut : la suite rapide reste rapide.
addopts = -m "not integration"
