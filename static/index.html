<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Luca's</title>
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" href="/app/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
    <meta name="theme-color" content="#00050a" />
    <link rel="stylesheet" href="/app/css/style.css" />
</head>
<body>
    <div id="app">
        <div id="connection-banner"></div>

        <button type="button" id="activity-toggle" class="icon-btn" title="Journal d'activité">
            📋<span id="activity-badge" class="badge"></span>
        </button>

        <button type="button" id="security-badge" class="icon-btn" title="État de sécurité">
            🛡️<span id="security-dot" class="status-dot"></span>
        </button>
        <div id="security-popover">
            <div id="security-popover-text"></div>
        </div>

        <button type="button" id="documents-toggle" class="icon-btn" title="Mes documents">
            📁
        </button>

        <button type="button" id="finance-toggle" class="icon-btn" title="Mes finances">
            💰
        </button>

        <div id="activity-drawer">
            <div id="activity-drawer-header">
                <span>Journal d'activité</span>
                <button type="button" id="activity-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="activity-log"></div>
        </div>

        <div id="documents-drawer">
            <div id="documents-drawer-header">
                <span>Mes documents</span>
                <button type="button" id="documents-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="documents-log"></div>
        </div>

        <div id="finance-drawer">
            <div id="finance-drawer-header">
                <span>Mes finances</span>
                <button type="button" id="finance-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="finance-log"></div>
        </div>

        <div id="avatar-panel">
            <canvas id="avatar-canvas" width="140" height="140"></canvas>
            <div id="avatar-label">prête</div>
        </div>

        <div id="chat-log"></div>

        <form id="input-bar">
            <button type="button" id="speak-toggle" class="icon-btn" title="Réponses vocales désactivées">🔇</button>
            <button type="button" id="camera-btn" class="icon-btn" title="Montrer à Luca's">📷</button>
            <button type="button" id="mic-btn" class="icon-btn" title="Parler à Luca's">🎙️</button>
            <input type="text" id="text-input" placeholder="Parler à Luca's..." autocomplete="off" />
            <button type="submit" id="send-btn" class="icon-btn" title="Envoyer">➤</button>
        </form>
    </div>

    <script src="/app/js/avatar.js"></script>
    <script src="/app/js/websocket.js"></script>
    <script src="/app/js/chat.js"></script>
    <script src="/app/js/activity.js"></script>
    <script src="/app/js/security.js"></script>
    <script src="/app/js/documents.js"></script>
    <script src="/app/js/finance.js"></script>
    <script src="/app/js/voice_output.js"></script>
    <script src="/app/js/audio.js"></script>
    <script src="/app/js/camera.js"></script>
    <script src="/app/js/app.js"></script>
</body>
</html>
