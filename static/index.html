<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Le lien d'appairage porte le jeton en query string (?token=...).
         Sans cette ligne, ce jeton partirait dans l'en-tête Referer de
         toute requête sortante déclenchée depuis cette page. La PWA n'en
         fait aucune aujourd'hui — c'est justement pour ça que la ligne
         coûte zéro et doit être posée maintenant plutôt qu'après le
         premier lien externe ajouté par distraction. Voir ROADMAP.md §5.33. -->
    <meta name="referrer" content="no-referrer" />
    <title>Luca's</title>
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" href="/app/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
    <meta name="theme-color" content="#00050a" />
    <link rel="stylesheet" href="/app/css/style.css" />
</head>
<body>
    <div id="app">
        <div id="connection-banner"></div>

        <button type="button" id="activity-toggle" class="icon-btn" title="Journal d'activité">
            📋<span id="activity-badge" class="badge"></span>
        </button>

        <button type="button" id="security-badge" class="icon-btn" title="État de sécurité">
            🛡️<span id="security-dot" class="status-dot"></span>
        </button>
        <div id="security-popover">
            <div id="security-popover-text"></div>
        </div>

        <button type="button" id="documents-toggle" class="icon-btn" title="Mes documents">
            📁
        </button>

        <button type="button" id="finance-toggle" class="icon-btn" title="Mes finances">
            💰
        </button>

        <a href="/app/workspace.html" id="workspace-link" class="icon-btn" title="Workspace Luca's">
            🖥️
        </a>

        <!-- Mode conversation mains libres (BRIEF_MODE_VOCAL_CONTINU_MOBILE.md,
             09/08/2026) : activation/désactivation explicites uniquement,
             jamais par défaut. Ce même bouton sert aussi d'arrêt immédiat
             (brief §4) — un second clic pendant que le mode est actif
             l'arrête sur-le-champ, voir conversation_mode.js. -->
        <button type="button" id="conv-mode-toggle" class="icon-btn" title="Mode conversation (mains libres)">
            🔁
        </button>

        <div id="activity-drawer">
            <div id="activity-drawer-header">
                <span>Journal d'activité</span>
                <button type="button" id="activity-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="activity-log"></div>
        </div>

        <div id="documents-drawer">
            <div id="documents-drawer-header">
                <span>Mes documents</span>
                <button type="button" id="documents-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="documents-log"></div>
        </div>

        <div id="finance-drawer">
            <div id="finance-drawer-header">
                <span>Mes finances</span>
                <button type="button" id="finance-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="finance-log"></div>
        </div>

        <!-- title="Retour à l'accueil" : seul chemin de retour vers home-view,
             hors barre de navigation (le brief F-1 liste 4 entrées : Chat,
             Vision, Workspace, Réglages -- "Accueil" n'en fait délibérément
             pas partie, ce n'est pas une nouvelle destination mais l'écran
             de départ). L'orbe restant visible dans les deux vues, en faire
             le chemin de retour n'ajoute aucun élément visuel de plus. -->
        <button type="button" id="avatar-panel" title="Retour à l'accueil">
            <canvas id="avatar-canvas" width="140" height="140"></canvas>
            <div id="avatar-label">prête</div>
        </button>

        <!-- Écran d'accueil (F-1, 09/08/2026) : orbe (ci-dessus, partagé) +
             liste compacte de ce que workspace_manager expose déjà. Vue par
             défaut à l'ouverture -- voir home.js pour le détail des 3
             sources (dernier rapport, demande en attente, raccourci vision)
             et le garde-fou RT-2 (jamais un élément vide affiché comme réel). -->
        <div id="home-view">
            <p class="home-hint">Aperçu — pour tout voir : <a href="/app/workspace.html">Workspace</a>.</p>
            <div class="home-list" id="home-list"></div>
        </div>

        <div id="chat-view">
            <div id="chat-log"></div>

            <form id="input-bar">
                <button type="button" id="speak-toggle" class="icon-btn" title="Réponses vocales désactivées">🔇</button>
                <button type="button" id="camera-btn" class="icon-btn" title="Montrer à Luca's">📷</button>
                <button type="button" id="mic-btn" class="icon-btn" title="Parler à Luca's">🎙️</button>
                <input type="text" id="text-input" placeholder="Parler à Luca's..." autocomplete="off" />
                <button type="submit" id="send-btn" class="icon-btn" title="Envoyer">➤</button>
            </form>
        </div>

        <!-- Tiroir Vision (F-1) : "accès direct aux modes de capture" (brief
             §3.3) -- réutilise une capacité déjà câblée (camera.js), aucune
             nouvelle route ni logique métier.
             Raccourci "Capture d'écran" retiré le 12/08/2026 (ROADMAP.md
             §5.92, cowork_workspace/BRIEF_RETRAIT_CAPTURE_ECRAN_MOBILE.md) :
             la cause du déclenchement récurrent signalé par Cyril n'était
             pas ce raccourci mais lucas_daemon.py (capture toutes les 30s,
             sans rapport avec le mobile) -- retiré quand même, la lecture
             d'écran mobile reste hors de portée d'une PWA (D-7). -->
        <div id="vision-drawer">
            <div id="vision-drawer-header">
                <span>Vision</span>
                <button type="button" id="vision-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="vision-list">
                <button type="button" class="vision-action" id="vision-camera">📷 Photo caméra</button>
            </div>
        </div>

        <!-- Tiroir Réglages (F-1) : consolide les panneaux déjà existants
             (activité/sécurité/documents/finances/voix), chacun ouvert en
             transmettant le clic au bouton réel déjà câblé -- pas une
             deuxième logique d'ouverture en parallèle. -->
        <div id="settings-drawer">
            <div id="settings-drawer-header">
                <span>Réglages</span>
                <button type="button" id="settings-close" class="icon-btn" title="Fermer">✕</button>
            </div>
            <div id="settings-list">
                <button type="button" class="settings-action" id="settings-voice">🔇 Réponses vocales</button>
                <!-- Volume TTS (ROADMAP.md §5.83 suite, 10/08/2026) : agit
                     sur voiceOutput.player.volume, indépendant du volume
                     système du téléphone. -->
                <div class="settings-action settings-volume-row" id="settings-volume">
                    <span class="settings-volume-label">🔊 Volume voix</span>
                    <div class="settings-volume-controls">
                        <button type="button" id="volume-down" class="icon-btn-small" aria-label="Baisser le volume">−</button>
                        <span id="volume-value">100%</span>
                        <button type="button" id="volume-up" class="icon-btn-small" aria-label="Augmenter le volume">+</button>
                    </div>
                </div>
                <button type="button" class="settings-action" id="settings-security">🛡️ État de sécurité</button>
                <button type="button" class="settings-action" id="settings-documents">📁 Mes documents</button>
                <button type="button" class="settings-action" id="settings-finance">💰 Mes finances</button>
                <button type="button" class="settings-action" id="settings-activity">📋 Journal d'activité</button>
            </div>
        </div>

        <!-- Barre de navigation basse (F-1, brief §3.3) : 4 entrées exactes,
             persistante quelle que soit la vue active (home-view/chat-view). -->
        <nav id="mobile-nav">
            <button type="button" class="nav-btn" id="nav-chat">
                <span class="nav-icon">💬</span><span class="nav-label">Chat</span>
            </button>
            <button type="button" class="nav-btn" id="nav-vision">
                <span class="nav-icon">👁️</span><span class="nav-label">Vision</span>
            </button>
            <a class="nav-btn" id="nav-workspace" href="/app/workspace.html">
                <span class="nav-icon">🖥️</span><span class="nav-label">Workspace</span>
            </a>
            <button type="button" class="nav-btn" id="nav-settings">
                <span class="nav-icon">⚙️</span><span class="nav-label">Réglages</span>
            </button>
        </nav>
    </div>

    <script src="/app/js/avatar.js"></script>
    <script src="/app/js/websocket.js"></script>
    <script src="/app/js/chat.js"></script>
    <script src="/app/js/activity.js"></script>
    <script src="/app/js/security.js"></script>
    <script src="/app/js/documents.js"></script>
    <script src="/app/js/finance.js"></script>
    <script src="/app/js/voice_output.js"></script>
    <script src="/app/js/audio.js"></script>
    <script src="/app/js/camera.js"></script>
    <script src="/app/js/vad.js"></script>
    <script src="/app/js/conversation_mode.js"></script>
    <script src="/app/js/home.js"></script>
    <script src="/app/js/app.js"></script>
</body>
</html>
