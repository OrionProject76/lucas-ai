<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Même garde que index.html (ROADMAP.md §5.33) : un lien d'appairage
         porte le jeton en query string, jamais dans un Referer sortant. -->
    <meta name="referrer" content="no-referrer" />
    <title>Workspace — Luca's</title>
    <link rel="icon" href="/app/icons/icon-192.png" />
    <meta name="theme-color" content="#00050a" />
    <link rel="stylesheet" href="/app/css/style.css" />
    <link rel="stylesheet" href="/app/css/workspace.css" />
</head>
<body>
    <div id="workspace">
        <header id="workspace-header">
            <h1>Workspace Luca's</h1>
            <div id="workspace-controls">
                <span id="workspace-status"></span>
                <button type="button" id="workspace-refresh" class="icon-btn" title="Actualiser">↻</button>
                <a href="/app/" class="icon-btn" title="Retour au chat">💬</a>
            </div>
        </header>

        <!-- data-card-id doit correspondre exactement à modules/workspace_manager.py::CARD_IDS
             (reports/requests/actions/objectives) — c'est ce que workspace.js lit/écrit
             pour la disposition persistée côté serveur. L'ordre ici n'est que le
             DÉFAUT initial avant que workspace.js n'applique la disposition réelle. -->
        <main id="workspace-grid">
            <section class="workspace-card card-size-M" id="card-reports" data-card-id="reports">
                <div class="workspace-card-header">
                    <button type="button" class="workspace-drag-handle" title="Déplacer" aria-label="Déplacer la carte Rapports produits">⠿</button>
                    <h2>Rapports produits</h2>
                    <div class="workspace-size-controls" role="group" aria-label="Taille de la carte Rapports produits">
                        <button type="button" class="workspace-size-btn" data-size="S">S</button>
                        <button type="button" class="workspace-size-btn" data-size="M">M</button>
                        <button type="button" class="workspace-size-btn" data-size="L">L</button>
                        <button type="button" class="workspace-size-btn" data-size="XL">XL</button>
                    </div>
                </div>
                <div class="workspace-list" id="reports-list"></div>
            </section>

            <section class="workspace-card card-size-M" id="card-requests" data-card-id="requests">
                <div class="workspace-card-header">
                    <button type="button" class="workspace-drag-handle" title="Déplacer" aria-label="Déplacer la carte Demandes en attente">⠿</button>
                    <h2>Demandes en attente</h2>
                    <div class="workspace-size-controls" role="group" aria-label="Taille de la carte Demandes en attente">
                        <button type="button" class="workspace-size-btn" data-size="S">S</button>
                        <button type="button" class="workspace-size-btn" data-size="M">M</button>
                        <button type="button" class="workspace-size-btn" data-size="L">L</button>
                        <button type="button" class="workspace-size-btn" data-size="XL">XL</button>
                    </div>
                </div>
                <div class="workspace-list" id="requests-list"></div>
            </section>

            <section class="workspace-card card-size-M" id="card-actions" data-card-id="actions">
                <div class="workspace-card-header">
                    <button type="button" class="workspace-drag-handle" title="Déplacer" aria-label="Déplacer la carte Actions récentes">⠿</button>
                    <h2>Actions récentes</h2>
                    <div class="workspace-size-controls" role="group" aria-label="Taille de la carte Actions récentes">
                        <button type="button" class="workspace-size-btn" data-size="S">S</button>
                        <button type="button" class="workspace-size-btn" data-size="M">M</button>
                        <button type="button" class="workspace-size-btn" data-size="L">L</button>
                        <button type="button" class="workspace-size-btn" data-size="XL">XL</button>
                    </div>
                </div>
                <div class="workspace-list" id="actions-list"></div>
            </section>

            <section class="workspace-card card-size-M" id="card-objectives" data-card-id="objectives">
                <div class="workspace-card-header">
                    <button type="button" class="workspace-drag-handle" title="Déplacer" aria-label="Déplacer la carte Objectifs en cours">⠿</button>
                    <h2>Objectifs en cours</h2>
                    <div class="workspace-size-controls" role="group" aria-label="Taille de la carte Objectifs en cours">
                        <button type="button" class="workspace-size-btn" data-size="S">S</button>
                        <button type="button" class="workspace-size-btn" data-size="M">M</button>
                        <button type="button" class="workspace-size-btn" data-size="L">L</button>
                        <button type="button" class="workspace-size-btn" data-size="XL">XL</button>
                    </div>
                </div>
                <div class="workspace-list" id="objectives-list"></div>
            </section>

            <section class="workspace-card card-size-M" id="card-sandbox" data-card-id="sandbox">
                <div class="workspace-card-header">
                    <button type="button" class="workspace-drag-handle" title="Déplacer" aria-label="Déplacer la carte Sandbox">⠿</button>
                    <h2>Sandbox</h2>
                    <div class="workspace-size-controls" role="group" aria-label="Taille de la carte Sandbox">
                        <button type="button" class="workspace-size-btn" data-size="S">S</button>
                        <button type="button" class="workspace-size-btn" data-size="M">M</button>
                        <button type="button" class="workspace-size-btn" data-size="L">L</button>
                        <button type="button" class="workspace-size-btn" data-size="XL">XL</button>
                    </div>
                </div>
                <p class="workspace-sandbox-hint">
                    Exécution isolée (réseau bloqué, fichiers limités à
                    <code>sandbox_workspace/</code>, délai maximal). Le code
                    reste proposé jusqu'à décision explicite.
                </p>
                <form id="sandbox-form">
                    <textarea id="sandbox-code" rows="5" spellcheck="false"
                        placeholder="print(&quot;bonjour depuis la sandbox&quot;)"></textarea>
                    <button type="submit" id="sandbox-submit">Proposer</button>
                </form>
                <div class="workspace-list" id="sandbox-list"></div>
            </section>
        </main>
    </div>

    <script src="/app/js/workspace.js"></script>
</body>
</html>
